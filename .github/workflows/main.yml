name: Generate snake animation

on:
  schedule:
    # วันละครั้ง 03:17 UTC (เลี่ยงนาที :00 ที่คิวแน่น)
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/main.yaml"   # push ธรรมดาไม่ต้องรีเจนใหม่

# กันรันทับกันตอน push รัวๆ (คนละรันแย่งกัน push branch output)
concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    name: Generate & publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-ocean.svg?color_snake=#4b91f1&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
